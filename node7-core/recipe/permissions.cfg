# ============================================================
# NODE7 CORE ACE PERMISSIONS
# Staff -> Moderator -> Admin -> Owner
# ============================================================

# Hierarchy
add_principal group.node7_owner group.node7_admin
add_principal group.node7_admin group.node7_moderator
add_principal group.node7_moderator group.node7_staff
add_principal group.node7_admin group.admin

# NODE7 permission objects
add_ace group.node7_staff node7.staff allow
add_ace group.node7_moderator node7.moderator allow
add_ace group.node7_moderator node7.mod allow
add_ace group.node7_admin node7.admin allow
add_ace group.node7_owner node7.owner allow
add_ace group.node7_owner node7.god allow
add_ace group.node7_admin node7admin.join allow

# Core admin commands
add_ace group.node7_admin command.tp allow
add_ace group.node7_admin command.tpm allow
add_ace group.node7_admin command.noclip allow
add_ace group.node7_admin command.addpermission allow
add_ace group.node7_admin command.removepermission allow
add_ace group.node7_admin command.openserver allow
add_ace group.node7_admin command.closeserver allow
add_ace group.node7_admin command.vehicle allow
add_ace group.node7_admin command.dv allow
add_ace group.node7_admin command.dvall allow
add_ace group.node7_admin command.dvp allow
add_ace group.node7_admin command.dvo allow
add_ace group.node7_admin command.givemoney allow
add_ace group.node7_admin command.setmoney allow
add_ace group.node7_admin command.removemoney allow
add_ace group.node7_admin command.setbloodtype allow
add_ace group.node7_admin command.setjob allow
add_ace group.node7_admin command.setgang allow

# Prevent destructive console shutdown through inherited command access.
add_ace group.node7_admin command.quit deny

# Allows node7-core's /addpermission and /removepermission commands to manage principals.
# This does NOT allow node7-core to create or modify ACE rules.
add_ace resource.node7-core command.add_principal allow
add_ace resource.node7-core command.remove_principal allow
