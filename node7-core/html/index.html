<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE7 Notifications</title>
    <style>
        /* Critical NUI transparency: prevents a black frame before style.css loads. */
        html, body, #notifications {
            background: transparent !important;
            background-color: rgba(0, 0, 0, 0) !important;
        }
        body:not(.nui-active) {
            visibility: hidden !important;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="status-hud" class="status-hud" aria-label="Character status">
        <div class="status-hud__brand">NODE7 LABS</div>
        <div id="status-name" class="status-hud__name"></div>
        <div class="status-hud__accounts">
            <div class="status-account status-account--cash"><span>CASH</span><strong id="status-cash">$0.00</strong></div>
            <div class="status-account status-account--bank"><span>BANK</span><strong id="status-bank">$0.00</strong></div>
            <div class="status-account status-account--gold"><span>GOLD</span><strong id="status-gold">0.00</strong></div>
        </div>
        <div id="status-blood-wrap" class="status-hud__blood"><span>BLOOD TYPE</span><strong id="status-bloodtype">--</strong></div>
    </aside>
    <main id="notifications" class="notifications" aria-live="polite" aria-atomic="false"></main>
    <template id="notification-template">
        <section class="notification" role="status">
            <div class="notification__smoke" aria-hidden="true"></div>
            <div class="notification__portrait-wrap" aria-hidden="true">
                <img class="notification__portrait" src="images/default-portrait.png" alt="">
            </div>
            <div class="notification__content">
                <div class="notification__title"></div>
                <div class="notification__message"></div>
            </div>
            <div class="notification__timer" aria-hidden="true"></div>
        </section>
    </template>
    <script src="app.js"></script>
</body>
</html>
